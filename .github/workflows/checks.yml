name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CLIENT_DOMAIN: aiclicks.io

jobs:
  table:
    name: Generated table matches its dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check table
        run: python render_table.py --check

  tracker:
    name: Tracker tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests, stdlib only
        run: python -m unittest discover -s tests -v
      - name: Report runs on the sample log
        run: |
          for v in brand prompt domains day; do
            python tracker/report.py examples/sample-runs.jsonl --config tracker/prompts.example.json --by $v
          done
      - name: Dry run builds valid payloads
        run: python tracker/track.py --config tracker/prompts.example.json --dry-run --runs 2

  links:
    name: Links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check client and github.com links
        run: |
          fail=0
          for url in $(grep -oh "https://\($CLIENT_DOMAIN\|github\.com\)[^)\"< ]*" README.md | sed 's/[.,]$//' | sort -u); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 25 "$url" || echo 000)
            if [ "$code" != "200" ]; then echo "  $code  $url"; fail=1; fi
          done
          exit $fail
