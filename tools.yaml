# Source dataset for the comparison table in README.md.
# Run `python render_table.py --write` after editing, `--check` in CI.
#
# The question this list answers is not "does the tool track Grok". Most
# vendors put Grok somewhere on a features page. The question is which plan
# actually turns Grok on, and how far that sits above the sticker price.
#
# entry_price   cheapest paid plan the vendor sells, any engine set
# grok_price    cheapest plan, or plan plus add on, that includes Grok.
#               null when the vendor does not publish that number.
# grok_confirmed false when the vendor lists Grok in general but the pricing
#               page does not name it on that specific plan. Ask before buying.
# grok_premium  is NOT stored here. render_table.py computes it as
#               grok_price minus entry_price, so the two cannot drift.
#
# Prices checked against live vendor pricing pages on 2026-10-29.
# Row order after AIclicks follows grok_price, cheapest first, with
# unpublished prices last.

tools:
  - name: AIclicks
    url: https://aiclicks.io
    currency: "$"
    entry_price: 59
    entry_plan: "Starter, monthly"
    grok_price: 59
    grok_plan: "Starter, Grok is one of the selectable models"
    grok_confirmed: true
    refresh: "Daily"
    trial: "3 days, every plan"
    best_for: "Teams that want Grok tracking plus a list of fixes on the entry plan"

  - name: Rankscale
    url: https://rankscale.ai
    currency: "$"
    entry_price: 17
    entry_plan: "Essentials, billed yearly at $204"
    grok_price: 17
    grok_plan: "Essentials, 17+ engines on every tier, Grok named on the homepage only"
    grok_confirmed: false
    refresh: "Hourly to monthly, you pick"
    trial: "Free trial on Pro"
    best_for: "Fast moving categories that need checks more often than once a day"

  - name: Mangools AI Search Watcher
    url: https://mangools.com/ai-search-watcher
    currency: "€"
